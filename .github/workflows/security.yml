name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, for newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python security lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4
      - run: bandit -r app.py catalog.py make_songs.py --severity-level medium --confidence-level medium

  pip-audit:
    name: pip-audit (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Live app, with everything it pulls in
        run: pip-audit -r requirements.txt
      - name: Song maker, as pinned here and in setup.bat / setup.sh
        run: |
          printf 'torch==2.14.1\ntorchaudio==2.11.0\naudio-separator==0.47.1\nonnxruntime-gpu==1.26.0\n' > maker-extras.txt
          pip-audit --no-deps -r requirements-maker.txt -r maker-extras.txt

  gitleaks:
    name: gitleaks (secrets in the history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_VERSION: 8.30.1  # the version .gitleaks.toml is written for

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  zap:
    name: OWASP ZAP baseline (the running app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Start the app
        run: |
          python app.py > app.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://localhost:5000/ > /dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:5000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
