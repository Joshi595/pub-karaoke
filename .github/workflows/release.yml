name: Release

# A version tag (v1.2.0) publishes the Windows package that Setup-Pub-PC.bat downloads and checks, and a
# Setup-Pub-PC.bat with that package inside it (no download needed). Only a tag on main that passes the tests is
# released; each file gets a SHA-256 checksum and a signed build provenance (`gh attestation verify <file> -R <repo>`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install -r requirements.txt pytest==9.2.0
          python -m pytest -q --ignore=test_browser.py
      - run: python windows/package.py
      - name: Checksums
        working-directory: dist
        run: sha256sum pub-karaoke-windows.zip Setup-Pub-PC.bat > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/pub-karaoke-windows.zip dist/Setup-Pub-PC.bat dist/SHA256SUMS.txt --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
