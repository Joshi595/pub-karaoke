name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest -q --ignore=test_browser.py
      - name: Setup script (what new users run)
        if: runner.os != 'Windows'
        run: ./setup.sh --no-maker
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck setup.sh start.sh install-autostart.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q test_browser.py
